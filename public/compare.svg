<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="Two comparison cards">
  <!-- left card -->
  <g transform="rotate(-2 70 75)">
    <rect x="20" y="26" width="96" height="98" rx="10" fill="#F0F5EC" stroke="#1C3836" stroke-width="3.5"/>
    <line x1="36" y1="58" x2="88" y2="58" stroke="#677872" stroke-width="4" stroke-linecap="round"/>
    <line x1="36" y1="76" x2="76" y2="76" stroke="#677872" stroke-width="4" stroke-linecap="round"/>
    <line x1="36" y1="94" x2="84" y2="94" stroke="#677872" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- right card -->
  <g transform="rotate(2 172 75)">
    <rect x="124" y="26" width="96" height="98" rx="10" fill="#FFF9EB" stroke="#1C3836" stroke-width="3.5"/>
    <path d="M140 58 L147 66 L158 51" fill="none" stroke="#205C42" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="170" y1="60" x2="204" y2="60" stroke="#677872" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 84 L147 92 L158 77" fill="none" stroke="#205C42" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="170" y1="86" x2="196" y2="86" stroke="#677872" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- vs badge -->
  <g transform="rotate(-6 120 60)">
    <circle cx="120" cy="60" r="20" fill="#F1C466" stroke="#1C3836" stroke-width="3.5"/>
    <text x="120" y="68" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#1C3836" text-anchor="middle">vs</text>
  </g>
  <!-- arrow doodle -->
  <path d="M104 122 Q120 116 136 122" fill="none" stroke="#A14F37" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M130 116 L137 123 L129 129" fill="none" stroke="#A14F37" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
